name: aegiscode

# Compose reads the root .env for interpolation. Pass only each service's inputs;
# never inject the full secret-bearing .env into the Vite or Ngrok containers.
x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173"]}'
  SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the root .env}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in the root .env}
  SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?Set SUPABASE_SERVICE_KEY in the root .env}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET in the root .env}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY_B64: ${GITHUB_APP_PRIVATE_KEY_B64:-}
  AI_SCANNING_ENABLED: ${AI_SCANNING_ENABLED:-false}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  SCAN_MAX_FILES: ${SCAN_MAX_FILES:-80}
  SCAN_MAX_DIFF_CHARS: ${SCAN_MAX_DIFF_CHARS:-100000}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  MAX_WEBHOOK_BYTES: ${MAX_WEBHOOK_BYTES:-1048576}
  SCANNERS_ENABLED: ${SCANNERS_ENABLED:-false}

services:
  scan-volume-init:
    build:
      context: ./backend
    user: root
    command: ["chown", "10001:10001", "/scan-data"]
    volumes:
      - scan-source:/scan-data
    restart: "no"

  backend:
    build:
      context: ./backend
    environment: *backend-environment
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  scan-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.scan_worker"]
    environment:
      <<: *backend-environment
      SCANNERS_ENABLED: "true"
      SCANNER_SERVICE_URL: http://scanner:8000
    volumes:
      - scan-source:/scan-data
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    depends_on:
      scan-volume-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      scanner:
        condition: service_started
    networks:
      - default
      - scanner-network
    # The image's HTTP healthcheck applies only to the API, not this worker.
    healthcheck:
      disable: true
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

  scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile.scanner
    command: ["uvicorn", "app.scanner_api:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
      TRIVY_CACHE_DIR: /cache/trivy
    volumes:
      - scan-source:/scan-data:ro
      - trivy-cache:/cache
    depends_on:
      scan-volume-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    networks:
      - scanner-network
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the root .env}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in the root .env}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  webhook-gateway:
    build:
      context: ./backend
    command: ["uvicorn", "app.webhook_main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the root .env}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?Set SUPABASE_SERVICE_KEY in the root .env}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET in the root .env}
      MAX_WEBHOOK_BYTES: ${MAX_WEBHOOK_BYTES:-1048576}
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=3); c.request('GET','/api/v1/webhooks/github'); sys.exit(0 if c.getresponse().status == 405 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:3.39.13-debian
    command: ["http", "http://webhook-gateway:8000", "--log=stdout", "--log-format=json"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in the root .env}
    depends_on:
      webhook-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trivy-cache:
  scan-source:

networks:
  scanner-network:
